# XcodeGen spec for the Pulse Strength host project (https://github.com/yonaskolb/XcodeGen, 2.38 or newer).
#
# PulseStrength.xcodeproj is generated from this file and COMMITTED, so Xcode can open it directly. After changing this file run
#   brew install xcodegen      # then check `xcodegen --version`: CI pins 2.46.0, another version may write a different project
#   xcodegen generate
# and commit the regenerated project (the `apple` CI job fails when the committed project is out of date).
#
# Targets
#   PulseStrength          iOS app (embeds the widget extension and the Watch app)
#   PulseStrengthWidgets   widget extension that hosts the Live Activity (Lock Screen + Dynamic Island)
#   PulseStrengthWatch     watchOS 10 single-target app (embedded in the iOS app through "Embed Watch Content")
#
# Visual test targets (the `visual` job of .github/workflows/strength-ios.yml; they write screenshots, see README.md,
# "Screenshots in CI"). They are in their own schemes only, so the app, widget and Watch schemes above never build them:
#   PulseStrengthUITests              iOS UI test: walks the app in the simulator, one screenshot per step (scheme PulseStrengthUITests)
#   PulseStrengthLiveSnapshotTests    iOS logic test without a host app: draws the Lock Screen / Dynamic Island views
#                                     (scheme PulseStrengthLiveSnapshots)
#   PulseStrengthWatchSnapshotTests   watchOS logic test without a host app: draws the Watch pages (scheme PulseStrengthWatchSnapshots)
#
# Info.plist files and entitlements are the committed files under Apps/<target>/ (INFOPLIST_FILE and
# CODE_SIGN_ENTITLEMENTS below); this spec does not use XcodeGen's `info:` / `entitlements:` generators, so there is
# exactly one source of truth for them.
#
# Signing: DEVELOPMENT_TEAM and PULSE_APP_BUNDLE_ID live in Config/Signing.xcconfig (optionally overridden by the git-ignored
# Config/Signing.local.xcconfig); every target inherits them. Placeholders to replace when this moves into the Pulse app (see README.md):
# those two values. The app uses no App Group: its data lives in Application Support.

name: PulseStrength

options:
  bundleIdPrefix: health.pulse
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  # XcodeGen 2.45+ writes the Xcode 16 project format by default, which Xcode 15.4 cannot open. Older XcodeGen
  # versions ignore this key.
  projectFormat: xcode15_3
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

fileGroups:
  - Config/Signing.xcconfig
  - README.md
  - ARCHITECTURE.md
  - project.yml

packages:
  PulseStrengthKit:
    path: Packages/PulseStrengthKit

# PULSE_APP_BUNDLE_ID (the widget and the Watch app derive their ids from it; the Watch Info.plist reads it for
# WKCompanionAppBundleIdentifier) and DEVELOPMENT_TEAM come from this file.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: "YES"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  # ---------------------------------------------------------------------------------------------------------------
  PulseStrength:
    type: application
    platform: iOS
    sources:
      - path: Apps/PulseStrength
      - path: Apps/Shared/Intents
    dependencies:
      - package: PulseStrengthKit
        product: PulseStrengthCore
      - package: PulseStrengthKit
        product: PulseStrengthActivity
      - package: PulseStrengthKit
        product: PulseStrengthIOS
      # Embedded automatically: app extensions go to "Embed Foundation Extensions", the watchOS app to "Embed Watch Content".
      - target: PulseStrengthWidgets
      - target: PulseStrengthWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSE_APP_BUNDLE_ID)
        INFOPLIST_FILE: Apps/PulseStrength/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/PulseStrength/PulseStrength.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

  # ---------------------------------------------------------------------------------------------------------------
  PulseStrengthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/PulseStrengthWidgets
      - path: Apps/Shared/Intents
      - path: Apps/Shared/LiveActivity
      # Home Screen, Lock Screen, StandBy and extra widgets (widgets/SPEC.md) and their shared helpers.
      - path: Apps/Shared/Widgets
        excludes:
          - Watch/**
      - path: Apps/Shared/Controls
        optional: true
    dependencies:
      - package: PulseStrengthKit
        product: PulseStrengthCore
      - package: PulseStrengthKit
        product: PulseStrengthActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSE_APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: Apps/PulseStrengthWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

  # ---------------------------------------------------------------------------------------------------------------
  PulseStrengthWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/PulseStrengthWatch
    dependencies:
      - package: PulseStrengthKit
        product: PulseStrengthCore
      - package: PulseStrengthKit
        product: PulseStrengthWatchUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSE_APP_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Apps/PulseStrengthWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/PulseStrengthWatch/PulseStrengthWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SKIP_INSTALL: "YES"

  # ---------------------------------------------------------------------------------------------------------------
  # Visual tests. None of the three is a dependency of an app target and none is in the PulseStrength /
  # PulseStrengthWatch schemes, so the normal builds neither compile nor package them. They have no Info.plist file,
  # hence GENERATE_INFOPLIST_FILE "YES" (the project-wide base value is "NO").
  # ---------------------------------------------------------------------------------------------------------------

  # UI test of the iPhone app (Apps/PulseStrengthUITests): launches PulseStrength with -PulseUITest (demo data, no
  # live services) and takes a screenshot after every step. Depending on the app target makes Xcode build the app
  # (with the widget extension and the Watch app) first, and XcodeGen sets TestTargetID for it.
  PulseStrengthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/PulseStrengthUITests
    dependencies:
      - target: PulseStrength
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSE_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PulseStrength
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

  # Snapshot test of the Live Activity (Lock Screen and Dynamic Island) views. A logic-test bundle WITHOUT a host app
  # (no TEST_HOST, no dependency on the PulseStrength target): it compiles the Live Activity views and the intents as its
  # own sources, exactly like the widget extension does, and renders them with ImageRenderer into PNG files. If
  # rendering without a host ever misbehaves, add `- target: PulseStrength` to the dependencies (XcodeGen then sets
  # TEST_HOST and BUNDLE_LOADER).
  PulseStrengthLiveSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/PulseStrengthLiveSnapshotTests
      - path: Apps/Shared/LiveActivity
      - path: Apps/Shared/Intents
    dependencies:
      - package: PulseStrengthKit
        product: PulseStrengthCore
      - package: PulseStrengthKit
        product: PulseStrengthActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSE_APP_BUNDLE_ID).livesnapshottests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

  # Snapshot test of the Watch pages (Apps/PulseStrengthWatchSnapshotTests), a watchOS logic-test bundle without a host
  # app (the Watch app is not standalone and touches HealthKit and WatchConnectivity at launch). It uses
  # `@testable import PulseStrengthWatchUI`, which needs the Debug configuration (ENABLE_TESTABILITY); the scheme and the CI
  # step both use Debug.
  PulseStrengthWatchSnapshotTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Apps/PulseStrengthWatchSnapshotTests
    dependencies:
      - package: PulseStrengthKit
        product: PulseStrengthCore
      - package: PulseStrengthKit
        product: PulseStrengthWatchUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSE_APP_BUNDLE_ID).watchsnapshottests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_TESTABILITY: "YES"
        SKIP_INSTALL: "YES"

schemes:
  # Builds everything: the app target depends on the widget extension and on the Watch app (built for the matching
  # watchOS SDK), so one `xcodebuild -scheme PulseStrength` compiles all three targets.
  PulseStrength:
    build:
      targets:
        PulseStrength: all
        PulseStrengthWidgets: all
    run:
      config: Debug
      executable: PulseStrength
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Runs the Watch app alone on a Watch simulator or a paired Watch.
  PulseStrengthWatch:
    build:
      targets:
        PulseStrengthWatch: all
    run:
      config: Debug
      executable: PulseStrengthWatch
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # ---------------------------------------------------------------------------------------------------------------
  # Visual-test schemes (CI job `visual`, see README.md "Screenshots in CI"). Each runs in Debug and has its own scheme,
  # so `xcodebuild -scheme PulseStrength` / `PulseStrengthWatch` (the `apple` job) never builds a test target.
  # Run them with e.g.  TEST_RUNNER_SCREENSHOT_DIR=/absolute/dir xcodebuild test -project PulseStrength.xcodeproj
  #   -scheme PulseStrengthLiveSnapshots -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
  # ---------------------------------------------------------------------------------------------------------------

  # Builds the app (with the widget extension and the Watch app, as target dependencies) and runs the UI flow.
  # The flow takes its own screenshots; Xcode's automatic per-action screenshots / screen recording stay off, so the
  # result bundle stays small and the recording does not slow down a flow with a 6 second undo window.
  PulseStrengthUITests:
    build:
      targets:
        PulseStrength: [test]
        PulseStrengthUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      captureScreenshotsAutomatically: false
      targets:
        - name: PulseStrengthUITests
          parallelizable: false
          randomExecutionOrder: false

  # Lock Screen / Dynamic Island snapshots; needs an iOS Simulator destination.
  PulseStrengthLiveSnapshots:
    build:
      targets:
        PulseStrengthLiveSnapshotTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PulseStrengthLiveSnapshotTests
          parallelizable: false
          randomExecutionOrder: false

  # Apple Watch page snapshots; needs a watchOS Simulator destination.
  PulseStrengthWatchSnapshots:
    build:
      targets:
        PulseStrengthWatchSnapshotTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PulseStrengthWatchSnapshotTests
          parallelizable: false
          randomExecutionOrder: false

# TEMPORARY. One-off mutation check of the Android billing-core tests; removed again in the next commit.
#
# Each job breaks one guarded behaviour in the checked-out source (inside the runner only, nothing is committed) and runs
# :billing-core:test. The job is green when the mutation was KILLED (tests failed on an assertion, no compile error) and red when
# it SURVIVED. The "none" job is the control: unmodified source must pass.

name: android-mutation-check

on:
  push:
    branches: [claude/gifted-volta-2tv1ly]
    paths: ['.github/workflows/android-mutation-check.yml']

permissions:
  contents: read

jobs:
  mutate:
    name: mutation ${{ matrix.mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutation:
          - none
          - no_retry
          - retry_with_stale_token
          - retry_twice
          - unknown_enum_throws
          - trust_window_30_days
          - trust_window_exclusive
    defaults:
      run:
        shell: bash
        working-directory: billing/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" | tail -n 3

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply mutation (${{ matrix.mutation }})
        env:
          MUTATION: ${{ matrix.mutation }}
        run: |
          python3 - <<'PY'
          import os, sys
          core = "billing-core/src/main/kotlin/com/robinjungerich/pulse/billing/"
          api = core + "OkHttpBillingApi.kt"
          wire = core + "WireSerializers.kt"
          cache = core + "EntitlementCache.kt"
          first = "        var raw = execute(method, url, headers, body, token())\n"
          retry = "        if (raw.status == 401) raw = execute(method, url, headers, body, token())\n"
          mutations = {
              "none": None,
              # the 401 retry is gone
              "no_retry": (api, retry, "        if (false) raw = execute(method, url, headers, body, token())\n"),
              # the retry happens but reuses the expired token instead of asking the provider again
              "retry_with_stale_token": (
                  api, first + retry,
                  "        val firstToken = token()\n"
                  "        var raw = execute(method, url, headers, body, firstToken)\n"
                  "        if (raw.status == 401) raw = execute(method, url, headers, body, firstToken)\n"),
              # the retry may happen twice
              "retry_twice": (
                  api, retry,
                  "        repeat(2) { if (raw.status == 401) raw = execute(method, url, headers, body, token()) }\n"),
              # an enum value the client does not know fails the whole response
              "unknown_enum_throws": (
                  wire, "it.wire == raw } ?: unknown",
                  "it.wire == raw } ?: throw SerializationException(\"unknown enum value $raw\")"),
              # the offline trust window is 30 days instead of 7
              "trust_window_30_days": (
                  cache, "<= OFFLINE_TRUST_WINDOW", "<= Duration.ofDays(30)"),
              # the offline trust window excludes its last instant
              "trust_window_exclusive": (
                  cache, "<= OFFLINE_TRUST_WINDOW", "< OFFLINE_TRUST_WINDOW"),
          }
          name = os.environ["MUTATION"]
          spec = mutations[name]
          if spec is None:
              print("control: source left unmodified")
              sys.exit(0)
          path, old, new = spec
          text = open(path, encoding="utf-8").read()
          if text.count(old) != 1:
              sys.exit(f"mutation target not found exactly once in {path}: {text.count(old)}")
          open(path, "w", encoding="utf-8").write(text.replace(old, new))
          print(f"applied {name} to {path}")
          PY
          git --no-pager diff --stat
          git --no-pager diff -U0 | head -n 40

      - name: Run :billing-core:test and judge the outcome
        env:
          MUTATION: ${{ matrix.mutation }}
        run: |
          set +e
          ./gradlew --no-daemon --continue :billing-core:test 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "gradle exit status: $status"
          if grep -qE '^e: ' "$RUNNER_TEMP/gradle.log"; then
            echo "HARNESS ERROR: the mutated source does not compile, so the result says nothing about the tests"
            grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -n 20
            exit 3
          fi
          export GRADLE_STATUS=$status
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          ran = 0
          failed = []
          for path in sorted(glob.glob("billing-core/build/test-results/test/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  ran += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(case.get("classname").split(".")[-1] + "." + case.get("name"))
          name = os.environ["MUTATION"]
          status = int(os.environ.get("GRADLE_STATUS", "0"))
          print(f"MUTATION RESULT {name}: {ran} tests ran, {len(failed)} failed")
          for item in failed:
              print(f"  FAILED {item}")
          if ran == 0:
              print("HARNESS ERROR: no test results were written")
              sys.exit(3)
          if name == "none":
              sys.exit(1 if failed or status != 0 else 0)
          if failed:
              print(f"MUTATION {name} KILLED by {len(failed)} test(s)")
              sys.exit(0)
          print(f"MUTATION {name} SURVIVED: no test failed")
          sys.exit(1)
          PY

# Pulse Strength (ios/): builds and tests the Swift package on Linux and compiles the Apple-only code on macOS.
#
#   core-linux  PulseStrengthCore on Linux (swift build / swift test, with and without the Combine shim).
#   apple       XcodeGen 2.46.0 -> PulseStrength.xcodeproj, a check that the COMMITTED ios/PulseStrength.xcodeproj matches
#               project.yml, package tests on macOS, xcodebuild of the iOS app (which also builds the widget extension and
#               the embedded Watch app) and of the Watch scheme, both for the simulators and without code signing (Xcode
#               16). Uploads the generated project as artifact `generated-xcodeproj`; see ios/README.md, "Verification status".
#   xcode26     The committed Xcode project, built with the newest Xcode 26 (macos-26 image) for the iOS and watchOS
#               simulators AND for the iOS / watchOS devices without code signing, plus the package tests: what a user
#               who opens the project in a current Xcode gets.
#   visual      Screenshots of the running UI, in parallel with `apple`: XcodeGen, then the Lock Screen / Dynamic Island snapshot
#               test and the iPhone UI flow test on an iPhone simulator and the Watch snapshot test on a watchOS simulator.
#               Uploads the PNGs, logs and result summaries as artifact `strength-screens` (14 days) and the zipped .xcresult
#               bundles as `strength-xcresults` (3 days). Failed assertions do not fail the job; only "no PNG at all" does.
#               See ios/README.md, "Screenshots in CI".
#   matrix      A short second screenshot tour (StrengthTourTests) on four simulators in parallel: dark mode, accessibility text size,
#               iPhone SE (3rd generation), oldest installed iOS 17+ runtime. A missing simulator prints `SKIPPED: <reason>` and does not
#               fail the entry. Artifact `strength-matrix-<name>` (14 days) with PNGs, a layout report and a digest at the end of the log.

name: strength-ios

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/strength-ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/strength-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strength-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    name: core-linux
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/Packages/PulseStrengthKit
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The shim stands in for Combine so that StrengthStore and WorkoutController compile and are tested on Linux.
      # A separate scratch path keeps the two configurations from invalidating each other's build products.
      - name: Build (Combine shim)
        run: swift build --scratch-path .build-shim -Xswiftc -DPULSE_COMBINE_SHIM

      - name: Test (Combine shim)
        run: swift test --scratch-path .build-shim -Xswiftc -DPULSE_COMBINE_SHIM

  apple:
    name: apple
    runs-on: macos-15
    timeout-minutes: 75
    env:
      LOG_DIR: ${{ github.workspace }}/build-logs
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # run_logged.sh <log file> <command...>: runs the command, tees the complete output to the log file and, when the
      # command fails, prints the unique "error:" lines and the last 150 lines of the log before failing the step.
      - name: Prepare logs
        run: |
          mkdir -p "$LOG_DIR"
          cat > "$RUNNER_TEMP/run_logged.sh" <<'SH'
          #!/usr/bin/env bash
          log="$1"
          shift
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=============== FAILED (exit $status): $* ==============="
            echo "----- grep -E \"error:\" $(basename "$log") | sort -u -----"
            grep -E "error:" "$log" | sort -u || true
            echo "----- last 150 lines of $(basename "$log") -----"
            tail -n 150 "$log"
          fi
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/run_logged.sh"

      # The project needs Xcode 16 (the code also builds with 15.4). Use the newest installed 16.x release.
      - name: Select Xcode 16
        run: |
          echo "Default: $(xcodebuild -version | head -n 1)"
          newest="$(python3 - <<'PY'
          import glob, re

          def key(path):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$", path)
              return tuple(int(part) for part in match.group(1).split(".")) if match else ()

          apps = [p for p in glob.glob("/Applications/Xcode_16*.app") if re.search(r"Xcode_16(\.\d+)*\.app$", p)]
          print(max(apps, key=key) if apps else "")
          PY
          )"
          if [ -n "$newest" ]; then
            echo "Selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          else
            echo "::warning::No Xcode 16.x installed on this runner image, using the default Xcode"
          fi
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      # XcodeGen is pinned so that the committed PulseStrength.xcodeproj can be compared with a fresh generate.
      - name: Install XcodeGen 2.46.0
        run: |
          VERSION=2.46.0
          DIST="$RUNNER_TEMP/xcodegen-dist"
          mkdir -p "$DIST"
          BIN=""
          if curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip" \
             && unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$DIST"; then
            BIN="$(find "$DIST" -type f -name xcodegen -path '*/bin/*' | head -n 1)"
          fi
          if [ -n "$BIN" ] && chmod +x "$BIN" && "$BIN" --version >/dev/null 2>&1; then
            echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
            export PATH="$(dirname "$BIN"):$PATH"
          else
            echo "::warning::Could not run the XcodeGen ${VERSION} release binary, using Homebrew's version instead"
            brew install xcodegen
          fi
          xcodegen --version
          echo "XCODEGEN_VERSION=$(xcodegen --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        id: generate
        working-directory: ios
        run: |
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodegen.log" xcodegen generate
          xcodebuild -list -project PulseStrength.xcodeproj | tee "$LOG_DIR/xcodebuild-list.log"
          cp PulseStrength.xcodeproj/project.pbxproj "$LOG_DIR/project.pbxproj"

      # PulseStrength.xcodeproj is committed so Xcode can open it without XcodeGen; this fails when it is missing from git or
      # when project.yml changed and the committed project was not regenerated.
      - name: Committed Xcode project is up to date
        id: project-sync
        continue-on-error: true
        working-directory: ios
        run: |
          if ! git ls-files --error-unmatch PulseStrength.xcodeproj/project.pbxproj >/dev/null 2>&1; then
            echo "::error::ios/PulseStrength.xcodeproj is not committed: run 'xcodegen generate' (XcodeGen 2.46.0) in ios/ and commit the result."
            exit 1
          fi
          changes="$(git status --porcelain -- PulseStrength.xcodeproj)"
          if [ -z "$changes" ]; then
            echo "The committed PulseStrength.xcodeproj matches project.yml."
            exit 0
          fi
          echo "$changes" | head -n 40
          git --no-pager diff --stat -- PulseStrength.xcodeproj | tail -n 40
          if [ "${XCODEGEN_VERSION:-}" != "2.46.0" ]; then
            echo "::warning::XcodeGen ${XCODEGEN_VERSION:-unknown} is not the pinned 2.46.0; the difference may only be a version difference."
          fi
          echo "::error::ios/PulseStrength.xcodeproj is out of date: run 'xcodegen generate' (XcodeGen 2.46.0) in ios/ and commit the result."
          exit 1

      - name: Upload the generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-xcodeproj
          path: |
            ios/PulseStrength.xcodeproj
            ios/project.yml
          if-no-files-found: ignore
          retention-days: 7

      # The compile steps run first and never stop the job, so a single run reports every failure; the final gate fails the job.
      - name: Build the iOS app (iOS Simulator; includes the widget extension and the Watch app)
        id: ios-build
        continue-on-error: true
        working-directory: ios
        run: |
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodebuild-ios.log" \
            xcodebuild -project PulseStrength.xcodeproj -scheme PulseStrength \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build the Watch app (watchOS Simulator)
        id: watch-build
        continue-on-error: true
        working-directory: ios
        run: |
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodebuild-watch.log" \
            xcodebuild -project PulseStrength.xcodeproj -scheme PulseStrengthWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test the package on macOS
        id: package-tests
        continue-on-error: true
        working-directory: ios/Packages/PulseStrengthKit
        run: |
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/swift-test-macos.log" swift test

      # Compact error digest at the very end of the log (easy to read from the tail of the job log).
      - name: Error digest
        if: always()
        run: |
          for f in xcodebuild-ios xcodebuild-watch swift-test-macos; do
            log="$LOG_DIR/$f.log"
            [ -f "$log" ] || continue
            echo "===== $f: unique errors ====="
            grep -E "error:" "$log" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -n 120 || true
          done

      # Proof that the builds really compiled the Swift sources: product listing, compile counts, unique warnings.
      - name: Build digest
        if: always()
        run: |
          for f in xcodebuild-ios xcodebuild-watch; do
            log="$LOG_DIR/$f.log"
            [ -f "$log" ] || continue
            echo "===== $f ====="
            grep -E "BUILD (SUCCEEDED|FAILED)" "$log" || true
            echo "swift compile steps: $(grep -cE '^(SwiftCompile|CompileSwiftSources|SwiftEmitModule|EmitSwiftModule)' "$log" || true)"
            echo "warnings (unique):"
            grep -E "warning:" "$log" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -n 100 || true
          done
          echo "===== products ====="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 \( -name "*.app" -o -name "*.appex" \) -not -path "*/Index.noindex/*" 2>/dev/null | head -n 20 || true
          echo "===== swift files per target in the generated project ====="
          grep -cE "\.swift in Sources" "$LOG_DIR/project.pbxproj" || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "### strength-ios: apple job"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| xcodegen generate | ${{ steps.generate.outcome }} |"
            echo "| committed Xcode project up to date | ${{ steps.project-sync.outcome }} |"
            echo "| xcodebuild PulseStrength (iOS Simulator) | ${{ steps.ios-build.outcome }} |"
            echo "| xcodebuild PulseStrengthWatch (watchOS Simulator) | ${{ steps.watch-build.outcome }} |"
            echo "| swift test (macOS) | ${{ steps.package-tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-ios-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate
        if: always()
        run: |
          status=0
          for outcome in "${{ steps.generate.outcome }}" "${{ steps.project-sync.outcome }}" "${{ steps.ios-build.outcome }}" "${{ steps.watch-build.outcome }}" "${{ steps.package-tests.outcome }}"; do
            if [ "$outcome" != "success" ]; then status=1; fi
          done
          exit $status

  # Screenshots of the running UI. Runs next to `apple` (needs nothing) and exists to PRODUCE PICTURES: every test step is
  # continue-on-error, the PNGs are collected and uploaded whatever happened, and the final gate fails the job only when not
  # a single PNG exists. Where to look: ios/README.md, "Screenshots in CI".
  #   strength-screens   (artifact, 14 days)  ui-*.png (iPhone UI flow), live-*.png (Lock Screen / Dynamic Island), watch-*.png,
  #                      ui-flow-log.txt, live-measurements.txt, watch-manifest.txt, digest.txt, logs/, results/
  #   strength-xcresults (artifact, 3 days)   the zipped .xcresult bundles
  # What a user gets who opens the committed project in a current Xcode: no XcodeGen, the newest Xcode 26 of the runner image,
  # simulator AND device SDKs (signing off), package tests with that Swift toolchain.
  xcode26:
    name: xcode26
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LOG_DIR: ${{ github.workspace }}/build-logs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and runtimes
        run: |
          mkdir -p "$LOG_DIR"
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          git ls-files ios/PulseStrength.xcodeproj | head -n 20

      - name: Build the iOS app for the iOS Simulator (committed project)
        id: ios-sim
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PulseStrength.xcodeproj -scheme PulseStrength -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$LOG_DIR/ios-simulator.log" | tail -n 5

      - name: Build the iOS app for an iPhone (device SDK, signing off; embeds the Watch app and the widget)
        id: ios-device
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PulseStrength.xcodeproj -scheme PulseStrength -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$LOG_DIR/ios-device.log" | tail -n 5

      - name: Build the Watch app for the watchOS Simulator and for an Apple Watch
        id: watch
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PulseStrength.xcodeproj -scheme PulseStrengthWatch -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$LOG_DIR/watch-simulator.log" | tail -n 5
          xcodebuild -project PulseStrength.xcodeproj -scheme PulseStrengthWatch -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$LOG_DIR/watch-device.log" | tail -n 5

      - name: Test the package on macOS
        id: package-tests
        continue-on-error: true
        working-directory: ios/Packages/PulseStrengthKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$LOG_DIR/swift-test.log" | tail -n 8

      - name: Error digest
        if: always()
        run: |
          for f in ios-simulator ios-device watch-simulator watch-device swift-test; do
            log="$LOG_DIR/$f.log"
            [ -f "$log" ] || continue
            echo "===== $f: $(grep -E 'BUILD (SUCCEEDED|FAILED)|Executed [0-9]+ tests' "$log" | tail -n 2 | tr '\n' ' ')"
            grep -E "error:" "$log" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -n 60 || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-xcode26-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate
        if: always()
        run: |
          status=0
          for outcome in "${{ steps.ios-sim.outcome }}" "${{ steps.ios-device.outcome }}" "${{ steps.watch.outcome }}" "${{ steps.package-tests.outcome }}"; do
            if [ "$outcome" != "success" ]; then status=1; fi
          done
          exit $status

  visual:
    name: visual
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LOG_DIR: ${{ github.workspace }}/visual-logs
      SCREENS_DIR: ${{ github.workspace }}/screens
      RESULTS_DIR: ${{ github.workspace }}/xcresults
      ZIP_DIR: ${{ github.workspace }}/xcresults-zip
      # xcodebuild passes every TEST_RUNNER_* variable to the test process with the prefix removed: the tests read SCREENSHOT_DIR.
      # The simulator shares the file system of the runner, so the path has to be absolute.
      TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screens
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Helpers (all in $RUNNER_TEMP):
      #   run_logged.sh <log> <command...>  runs the command, tees the complete output to the log and, when it fails, prints the
      #                                     unique error / failure lines and the last 100 lines.
      #   pick_sim.py ios|watchos           prints "<udid><TAB><name><TAB><runtime>" of the simulator to use; creates one when the
      #                                     runner image has none.
      #   summarize_result.py <json> <name> turns `xcresulttool get test-results summary` JSON into a few readable lines.
      #   fallback_attachments.py ...       copies PNG attachments of an .xcresult to the screens directory (only used when a
      #                                     suite wrote no PNG files itself).
      - name: Prepare
        run: |
          mkdir -p "$LOG_DIR" "$SCREENS_DIR" "$RESULTS_DIR" "$ZIP_DIR"

          cat > "$RUNNER_TEMP/run_logged.sh" <<'SH'
          #!/usr/bin/env bash
          log="$1"
          shift
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=============== FAILED (exit $status): $* ==============="
            echo "----- unique error / failure lines of $(basename "$log") -----"
            grep -E "error:|XCTAssert|failed|FAILED" "$log" | LC_ALL=C sed -E 's#/Users/runner/work/[^/]+/[^/]+/##g' | LC_ALL=C cut -c1-300 | sort -u | head -n 80 || true
            echo "----- last 100 lines of $(basename "$log") -----"
            tail -n 100 "$log"
          fi
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/run_logged.sh"

          cat > "$RUNNER_TEMP/pick_sim.py" <<'PY'
          import json
          import subprocess
          import sys

          PREFERRED = {
              "ios": ["iPhone 16 Pro", "iPhone 15 Pro", "iPhone 16", "iPhone 15", "iPhone 16 Pro Max", "iPhone 15 Pro Max"],
              "watchos": ["Apple Watch Series 10 (46mm)", "Apple Watch Series 10 (42mm)", "Apple Watch Ultra 2 (49mm)",
                          "Apple Watch Series 9 (45mm)", "Apple Watch Series 9 (41mm)"],
          }
          OS_NAME = {"ios": "iOS", "watchos": "watchOS"}
          FAMILY = {"ios": "iPhone", "watchos": "Apple Watch"}


          def log(message):
              print(message, file=sys.stderr)


          def simctl(*args):
              return subprocess.check_output(["xcrun", "simctl"] + list(args), text=True)


          def runtime_version(identifier):
              # com.apple.CoreSimulator.SimRuntime.iOS-18-2 -> (18, 2)
              tail = identifier.rsplit(".", 1)[-1]
              return tuple(int(part) for part in tail.split("-")[1:] if part.isdigit())


          def is_runtime(identifier, os_name):
              return ("SimRuntime." + os_name + "-") in identifier


          def rank(name, preferred):
              return preferred.index(name) if name in preferred else len(preferred)


          def main():
              kind = sys.argv[1]
              os_name = OS_NAME[kind]
              family = FAMILY[kind]
              preferred = PREFERRED[kind]

              devices = json.loads(simctl("list", "devices", "available", "-j")).get("devices", {})
              found = []
              for runtime, entries in devices.items():
                  if not is_runtime(runtime, os_name):
                      continue
                  for entry in entries:
                      name = entry.get("name", "")
                      if entry.get("isAvailable", True) and name.startswith(family):
                          newest_first = tuple(-number for number in runtime_version(runtime))
                          found.append((rank(name, preferred), newest_first, name, entry["udid"], runtime))
              found.sort()
              log("installed " + family + " simulators, best first:")
              for item in found[:15]:
                  log("  " + item[2] + "  " + item[4] + "  " + item[3])
              if found:
                  best = found[0]
                  print("\t".join([best[3], best[2], best[4]]))
                  return 0

              log("no " + family + " simulator is installed; creating one")
              runtimes = [r for r in json.loads(simctl("list", "runtimes", "available", "-j")).get("runtimes", [])
                          if is_runtime(r.get("identifier", ""), os_name) and r.get("isAvailable", True)]
              if not runtimes:
                  log("no available " + os_name + " runtime")
                  return 1
              runtimes.sort(key=lambda r: runtime_version(r["identifier"]), reverse=True)
              runtime = runtimes[0]
              types = [t for t in runtime.get("supportedDeviceTypes", []) if t.get("name", "").startswith(family)]
              if not types:
                  log("the runtime " + runtime["identifier"] + " supports no " + family + " device type")
                  return 1
              types.sort(key=lambda t: (rank(t["name"], preferred), 0 if ("Series" in t["name"] or "Pro" in t["name"]) else 1))
              chosen = types[0]
              name = "Pulse " + family + " CI"
              udid = simctl("create", name, chosen["identifier"], runtime["identifier"]).strip()
              log("created " + name + " (" + chosen["name"] + ") on " + runtime["identifier"] + ": " + udid)
              print("\t".join([udid, name, runtime["identifier"]]))
              return 0


          sys.exit(main())
          PY

          cat > "$RUNNER_TEMP/summarize_result.py" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          label = sys.argv[2]
          try:
              with open(path) as handle:
                  data = json.load(handle)
          except Exception as error:
              print(label + ": no readable result summary (" + str(error) + ")")
              sys.exit(0)
          if not isinstance(data, dict):
              print(label + ": unexpected result summary of type " + type(data).__name__)
              sys.exit(0)


          def text(value):
              return "?" if value is None else str(value)


          print(label + ": result=" + text(data.get("result")) + " total=" + text(data.get("totalTestCount"))
                + " passed=" + text(data.get("passedTests")) + " failed=" + text(data.get("failedTests"))
                + " skipped=" + text(data.get("skippedTests")))
          for failure in data.get("testFailures") or []:
              if isinstance(failure, dict):
                  print("  FAILED " + text(failure.get("testName")) + " [" + text(failure.get("targetName")) + "]: "
                        + text(failure.get("failureText")))
          for insight in data.get("topInsights") or []:
              if isinstance(insight, dict):
                  print("  insight: " + text(insight.get("text")))
          PY

          cat > "$RUNNER_TEMP/fallback_attachments.py" <<'PY'
          import json
          import os
          import re
          import shutil
          import sys

          manifest_path = sys.argv[1]
          attachments_dir = sys.argv[2]
          out_dir = sys.argv[3]
          prefixes = sys.argv[4:]
          try:
              with open(manifest_path) as handle:
                  manifest = json.load(handle)
          except Exception as error:
              print("cannot read " + manifest_path + ": " + str(error))
              sys.exit(0)

          items = []


          def walk(node):
              if isinstance(node, dict):
                  if "exportedFileName" in node:
                      items.append(node)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)


          walk(manifest)
          copied = 0
          for item in items:
              exported = str(item.get("exportedFileName"))
              name = str(item.get("suggestedHumanReadableName") or exported)
              name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.[A-Za-z0-9]+$)", "", name)
              name = re.sub(r"(\.png)+$", ".png", os.path.basename(name), flags=re.IGNORECASE)
              if not name.lower().endswith(".png"):
                  continue
              if not any(name.startswith(prefix) for prefix in prefixes):
                  continue
              name = re.sub(r"[^A-Za-z0-9._-]", "_", name)
              source = os.path.join(attachments_dir, exported)
              target = os.path.join(out_dir, name)
              if os.path.isfile(source) and not os.path.exists(target):
                  shutil.copyfile(source, target)
                  copied += 1
          print("copied " + str(copied) + " PNG attachment(s) of " + str(len(items)) + " listed in the manifest")
          PY

      # The project needs Xcode 16 (the code also builds with 15.4). Use the newest installed 16.x release.
      - name: Select Xcode 16
        run: |
          echo "Default: $(xcodebuild -version | head -n 1)"
          newest="$(python3 - <<'PY'
          import glob, re

          def key(path):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$", path)
              return tuple(int(part) for part in match.group(1).split(".")) if match else ()

          apps = [p for p in glob.glob("/Applications/Xcode_16*.app") if re.search(r"Xcode_16(\.\d+)*\.app$", p)]
          print(max(apps, key=key) if apps else "")
          PY
          )"
          if [ -n "$newest" ]; then
            echo "Selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          else
            echo "::warning::No Xcode 16.x installed on this runner image, using the default Xcode"
          fi
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        id: generate
        working-directory: ios
        run: |
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodegen.log" xcodegen generate
          xcodebuild -list -project PulseStrength.xcodeproj | tee "$LOG_DIR/xcodebuild-list.log"

      # --- iPhone simulator: the Lock Screen snapshots and the UI flow --------------------------------------------------------
      # Prefers iPhone 16 Pro, then 15 Pro (Dynamic Island), else any iPhone; creates one when the image has none. The UDID is
      # exported before the boot, so a hanging or failing `bootstatus` still lets xcodebuild try to boot the device itself.
      - name: Boot an iPhone simulator
        id: iphone
        continue-on-error: true
        timeout-minutes: 10
        run: |
          picked="$(python3 "$RUNNER_TEMP/pick_sim.py" ios)"
          udid="$(printf '%s' "$picked" | cut -f1)"
          name="$(printf '%s' "$picked" | cut -f2)"
          echo "Using the iPhone simulator '$name' ($udid)"
          echo "IOS_UDID=$udid" >> "$GITHUB_ENV"
          # XCUIElement.typeText needs the software keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO || true
          if ! xcrun simctl bootstatus "$udid" -b; then
            echo "::warning::simctl bootstatus failed for the iPhone simulator; xcodebuild will try to boot it"
          fi
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 \
            || echo "::warning::could not override the simulator status bar"
          xcrun simctl list devices available | tee "$LOG_DIR/simctl-devices.log"

      # --- Test steps: continue-on-error, so the screenshots are always collected. A red step here only means that a test
      # --- failed to compile or that an assertion failed; look at the digest at the end of the log. -------------------------
      - name: Lock Screen and Dynamic Island snapshots (iPhone simulator)
        id: live
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ios
        run: |
          if [ -z "${IOS_UDID:-}" ]; then
            echo "::error::No iPhone simulator is available (see the step 'Boot an iPhone simulator')"
            exit 1
          fi
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodebuild-live.log" \
            xcodebuild test -project PulseStrength.xcodeproj -scheme PulseStrengthLiveSnapshots \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULTS_DIR/live.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: UI flow of the iPhone app (iPhone simulator)
        id: ui
        continue-on-error: true
        timeout-minutes: 24
        working-directory: ios
        run: |
          if [ -z "${IOS_UDID:-}" ]; then
            echo "::error::No iPhone simulator is available (see the step 'Boot an iPhone simulator')"
            exit 1
          fi
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodebuild-ui.log" \
            xcodebuild test -project PulseStrength.xcodeproj -scheme PulseStrengthUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULTS_DIR/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # --- Apple Watch simulator: the Watch page snapshots (a standalone, unpaired watchOS simulator is enough) --------------
      - name: Boot a watchOS simulator
        id: watchsim
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # The standard runner has 7 GB of memory: shut the iPhone simulator down before the Watch tests.
          if [ -n "${IOS_UDID:-}" ]; then
            xcrun simctl shutdown "$IOS_UDID" || true
          fi
          picked="$(python3 "$RUNNER_TEMP/pick_sim.py" watchos)"
          udid="$(printf '%s' "$picked" | cut -f1)"
          name="$(printf '%s' "$picked" | cut -f2)"
          echo "Using the watchOS simulator '$name' ($udid)"
          echo "WATCH_UDID=$udid" >> "$GITHUB_ENV"
          if ! xcrun simctl bootstatus "$udid" -b; then
            echo "::warning::simctl bootstatus failed for the watchOS simulator; xcodebuild will try to boot it"
          fi

      - name: Watch page snapshots (watchOS simulator)
        id: watch
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ios
        run: |
          if [ -z "${WATCH_UDID:-}" ]; then
            echo "::error::No watchOS simulator is available (see the step 'Boot a watchOS simulator')"
            exit 1
          fi
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodebuild-watch.log" \
            xcodebuild test -project PulseStrength.xcodeproj -scheme PulseStrengthWatchSnapshots \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=$WATCH_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULTS_DIR/watch.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # --- Collection ---------------------------------------------------------------------------------------------------------
      # xcresult summaries (`xcresulttool get test-results`, Xcode 16; every call may fail without consequence), a fallback that
      # exports the PNG attachments of a bundle when its suite wrote no PNG files itself, the logs, and the zipped bundles.
      - name: Collect results
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR/results" "$SCREENS_DIR/logs" "$ZIP_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }

          for bundle in "$RESULTS_DIR"/*.xcresult; do
            [ -e "$bundle" ] || continue
            name="$(basename "$bundle" .xcresult)"
            summary="$SCREENS_DIR/results/$name-summary.json"
            failures="$SCREENS_DIR/results/$name-failures.txt"
            if xcrun xcresulttool get test-results summary --path "$bundle" > "$summary" 2> "$SCREENS_DIR/results/$name-summary.err"; then
              python3 "$RUNNER_TEMP/summarize_result.py" "$summary" "$name" > "$failures" || true
            else
              echo "$name: xcresulttool could not read the result bundle (see $name-summary.err)" > "$failures"
            fi
            cat "$failures"
          done

          for suite in ui live watch; do
            bundle="$RESULTS_DIR/$suite.xcresult"
            if [ "$(count "$suite-*.png")" -eq 0 ] && [ -d "$bundle" ]; then
              echo "No $suite-*.png was written to $SCREENS_DIR: trying to export the attachments of $suite.xcresult"
              att="$RUNNER_TEMP/attachments-$suite"
              rm -rf "$att"
              mkdir -p "$att"
              if xcrun xcresulttool export attachments --path "$bundle" --output-path "$att" > "$LOG_DIR/export-attachments-$suite.log" 2>&1; then
                python3 "$RUNNER_TEMP/fallback_attachments.py" "$att/manifest.json" "$att" "$SCREENS_DIR" "$suite-" || true
              else
                echo "xcresulttool export attachments failed (see logs/export-attachments-$suite.log)"
              fi
            fi
          done

          cp "$LOG_DIR"/*.log "$SCREENS_DIR/logs/" 2>/dev/null || true

          for bundle in "$RESULTS_DIR"/*.xcresult; do
            [ -e "$bundle" ] || continue
            ditto -c -k --sequesterRsrc --keepParent "$bundle" "$ZIP_DIR/$(basename "$bundle").zip" \
              || echo "::warning::could not zip $bundle"
          done
          ls -la "$ZIP_DIR" || true

      # The digest goes into the artifact (digest.txt) and is printed again by the gate, at the very end of the log.
      - name: Write the digest
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          tidy() { LC_ALL=C sed -E 's#/Users/runner/work/[^/]+/[^/]+/##g' | LC_ALL=C cut -c1-300; }
          {
            echo "strength-ios visual digest"
            echo "PNGs: ui=$(count 'ui-*.png') live=$(count 'live-*.png') watch=$(count 'watch-*.png') total=$(count '*.png')"

            for name in xcodegen xcodebuild-live xcodebuild-ui xcodebuild-watch; do
              log="$LOG_DIR/$name.log"
              echo ""
              if [ ! -f "$log" ]; then
                echo "===== $name: no log (the step did not run) ====="
                continue
              fi
              echo "===== $name: verdict ====="
              grep -E "\*\* (BUILD|TEST) (SUCCEEDED|FAILED) \*\*|Executed [0-9]+ tests?, with|Testing failed" "$log" | tail -n 5 || true
              echo "===== $name: unique error: / XCTAssert / failed lines ====="
              grep -E "error:|XCTAssert|failed|FAILED" "$log" | tidy | sort -u | head -n 60 || true
            done

            for failures in "$SCREENS_DIR"/results/*-failures.txt; do
              [ -e "$failures" ] || continue
              echo ""
              echo "===== xcresult summary: $(basename "$failures" -failures.txt) ====="
              head -n 40 "$failures" | cut -c1-400
            done

            if [ -f "$SCREENS_DIR/ui-flow-log.txt" ]; then
              echo ""
              echo "===== ui-flow-log.txt: summary and FAILED / SKIPPED steps ====="
              grep "SUMMARY:" "$SCREENS_DIR/ui-flow-log.txt" | cut -c1-300 || true
              grep -A2 -E "\] (FAILED|SKIPPED)" "$SCREENS_DIR/ui-flow-log.txt" | cut -c1-300 | head -n 120 || true
            fi
            if [ -f "$SCREENS_DIR/live-measurements.txt" ]; then
              echo ""
              echo "===== live-measurements.txt: VIOLATION / note lines ====="
              grep -E "VIOLATION|note:" "$SCREENS_DIR/live-measurements.txt" | cut -c1-300 | head -n 60 || true
            fi
            if [ -f "$SCREENS_DIR/watch-manifest.txt" ]; then
              echo ""
              echo "===== watch-manifest.txt: BLANK images ====="
              grep "BLANK" "$SCREENS_DIR/watch-manifest.txt" | cut -c1-200 | head -n 60 || true
            fi

            for suite in ui live watch; do
              echo ""
              echo "===== $suite: $(count "$suite-*.png") PNG file names ====="
              find "$SCREENS_DIR" -maxdepth 1 -type f -name "$suite-*.png" | sed 's#.*/##' | sort | paste -s -d ' ' - | fold -s -w 180 || true
            done
            echo ""
            echo "===== other files in screens/ ====="
            find "$SCREENS_DIR" -maxdepth 1 -type f ! -name '*.png' | sed 's#.*/##' | sort | paste -s -d ' ' - | fold -s -w 180 || true
          } > "$SCREENS_DIR/digest.txt"
          echo "digest written to screens/digest.txt ($(wc -l < "$SCREENS_DIR/digest.txt" | tr -d ' ') lines); it is printed again by the Gate step"

      - name: Job summary
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          {
            echo "### strength-ios: visual job"
            echo ""
            echo "| Step | Result | PNGs |"
            echo "| --- | --- | --- |"
            echo "| xcodegen generate | ${{ steps.generate.outcome }} | |"
            echo "| iPhone simulator | ${{ steps.iphone.outcome }} | |"
            echo "| Lock Screen and Dynamic Island snapshots | ${{ steps.live.outcome }} | $(count 'live-*.png') |"
            echo "| UI flow of the iPhone app | ${{ steps.ui.outcome }} | $(count 'ui-*.png') |"
            echo "| watchOS simulator | ${{ steps.watchsim.outcome }} | |"
            echo "| Watch page snapshots | ${{ steps.watch.outcome }} | $(count 'watch-*.png') |"
            echo ""
            echo "Screenshots: artifact **strength-screens** (PNGs, ui-flow-log.txt, digest.txt, logs/). Result bundles: artifact **strength-xcresults**."
            echo "A failed test step does not fail the job; only a run without any PNG does."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-screens
          path: screens/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-xcresults
          path: xcresults-zip/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

      # Fails only when not a single PNG exists. Failed assertions do not matter here: the job exists to produce screenshots.
      - name: Gate
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          echo "================ strength-ios visual: final digest ================"
          cat "$SCREENS_DIR/digest.txt" || echo "(no digest was written)"
          echo ""
          echo "================ strength-ios visual: verdict ================"
          echo "step outcomes: generate=${{ steps.generate.outcome }} iphone=${{ steps.iphone.outcome }} live=${{ steps.live.outcome }} ui=${{ steps.ui.outcome }} watchsim=${{ steps.watchsim.outcome }} watch=${{ steps.watch.outcome }}"
          ui="$(count 'ui-*.png')"
          live="$(count 'live-*.png')"
          watch="$(count 'watch-*.png')"
          total="$(count '*.png')"
          echo "PNGs: ui=$ui live=$live watch=$watch total=$total"
          if [ "$ui" -eq 0 ]; then echo "::warning title=No UI flow screenshots::The iPhone UI flow produced no PNG (see the digest and the log of the UI flow step)"; fi
          if [ "$live" -eq 0 ]; then echo "::warning title=No Lock Screen screenshots::The Live Activity snapshot suite produced no PNG (see the digest)"; fi
          if [ "$watch" -eq 0 ]; then echo "::warning title=No Watch screenshots::The Watch snapshot suite produced no PNG (see the digest)"; fi
          if [ "$total" -eq 0 ]; then
            echo "::error::No screenshot was produced at all"
            exit 1
          fi
          echo "OK: $total screenshot(s) in the artifact strength-screens"

  # A SHORT second screenshot tour (ios/Apps/PulseStrengthUITests/StrengthTourTests.swift, 21 screenshots, about 4 minutes) under
  # four conditions the long flow of `visual` never looks at. One runner per entry, in parallel, and no entry stops the others:
  #   dark    iPhone 16 Pro, dark appearance               (the dark values of PulseTheme)
  #   xxl     iPhone 16 Pro, content size accessibility-extra-large   (layouts at Dynamic Type accessibility sizes)
  #   se      iPhone SE (3rd generation), 375 x 667 pt     (the active-workout screen must fit without page scrolling)
  #   ios17   an iPhone on the oldest installed iOS runtime >= 17.0   (runtime differences)
  # A simulator type or runtime that the runner does not have prints a line `SKIPPED: <reason>` and the entry still succeeds.
  # Every other failure (compile error, failed assertion, crashed test) does not fail the entry either: the final gate fails it
  # only when not a single PNG exists. The END of each job log is a digest: errors, number of PNGs, the LAYOUT VIOLATION lines and
  # the layout file. Artifact per entry: strength-matrix-<name> (14 days): tour-<name>-NN-*.png, tour-<name>-layout.txt,
  # tour-<name>-flow-log.txt, simulator-settings.txt, digest.txt, logs/, results/. See ios/README.md, "Screenshots in CI".
  matrix:
    name: matrix (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dark
            device: 'iPhone 16 Pro'
            appearance: dark
            content_size: large
          - name: xxl
            device: 'iPhone 16 Pro'
            appearance: light
            content_size: accessibility-extra-large
          - name: se
            device: 'iPhone SE (3rd generation)'
            appearance: light
            content_size: large
          - name: ios17
            # Not a device name: pick_tour_sim.py takes the oldest installed iOS runtime >= 17.0 and an iPhone on it.
            device: 'oldest iPhone on the oldest iOS runtime >= 17.0'
            appearance: light
            content_size: large
    env:
      TOUR_NAME: ${{ matrix.name }}
      TOUR_DEVICE: ${{ matrix.device }}
      TOUR_APPEARANCE: ${{ matrix.appearance }}
      TOUR_CONTENT_SIZE: ${{ matrix.content_size }}
      LOG_DIR: ${{ github.workspace }}/matrix-logs
      SCREENS_DIR: ${{ github.workspace }}/screens
      RESULTS_DIR: ${{ github.workspace }}/xcresults
      # xcodebuild passes every TEST_RUNNER_* variable to the test process with the prefix removed: the tour reads
      # SCREENSHOT_DIR (an absolute path: the simulator shares the file system of the runner) and TOUR_CONFIG (the file name part).
      TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screens
      TEST_RUNNER_TOUR_CONFIG: ${{ matrix.name }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Helpers (all in $RUNNER_TEMP), the same ones as in `visual` except pick_tour_sim.py:
      #   run_logged.sh <log> <command...>  runs the command, tees the complete output to the log and, when it fails, prints the
      #                                     unique error / failure lines and the last 100 lines.
      #   pick_tour_sim.py <device>         prints "OK<TAB>udid<TAB>name<TAB>runtime id<TAB>runtime name" or "SKIPPED<TAB>reason";
      #                                     creates the device when its type exists on a runtime but no device does.
      #   summarize_result.py, fallback_attachments.py   as in `visual`.
      - name: Prepare
        run: |
          mkdir -p "$LOG_DIR" "$SCREENS_DIR" "$RESULTS_DIR"

          cat > "$RUNNER_TEMP/run_logged.sh" <<'SH'
          #!/usr/bin/env bash
          log="$1"
          shift
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=============== FAILED (exit $status): $* ==============="
            echo "----- unique error / failure lines of $(basename "$log") -----"
            grep -E "error:|XCTAssert|failed|FAILED" "$log" | LC_ALL=C sed -E 's#/Users/runner/work/[^/]+/[^/]+/##g' | LC_ALL=C cut -c1-300 | sort -u | head -n 80 || true
            echo "----- last 100 lines of $(basename "$log") -----"
            tail -n 100 "$log"
          fi
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/run_logged.sh"

          cat > "$RUNNER_TEMP/pick_tour_sim.py" <<'PY'
          import json
          import subprocess
          import sys
          import traceback

          # The "oldest" entry runs the tour on the oldest iOS runtime >= 17.0 that is installed. The device is the model closest to
          # the iPhone 16 Pro that exists on that runtime, so that the runtime is the only difference between that run and the others.
          OLDEST_PREFERENCE = ["iPhone 15 Pro", "iPhone 15", "iPhone 14 Pro", "iPhone 14", "iPhone 15 Pro Max", "iPhone 14 Pro Max",
                               "iPhone 13 Pro", "iPhone 13", "iPhone SE (3rd generation)"]
          MINIMUM = (17, 0)
          CREATE_ERRORS = []


          def log(message):
              print(message, file=sys.stderr)


          def simctl(*args):
              return subprocess.check_output(["xcrun", "simctl"] + list(args), text=True)


          def runtime_version(identifier):
              # com.apple.CoreSimulator.SimRuntime.iOS-17-5 -> (17, 5)
              tail = identifier.rsplit(".", 1)[-1]
              return tuple(int(part) for part in tail.split("-")[1:] if part.isdigit())


          def ios_runtimes():
              data = json.loads(simctl("list", "runtimes", "available", "-j"))
              found = []
              for runtime in data.get("runtimes", []):
                  identifier = runtime.get("identifier", "")
                  if "SimRuntime.iOS-" not in identifier or not runtime.get("isAvailable", True):
                      continue
                  version = runtime_version(identifier)
                  if version and version >= MINIMUM:
                      found.append(runtime)
              found.sort(key=lambda r: runtime_version(r["identifier"]))
              return found


          def available_devices():
              return json.loads(simctl("list", "devices", "available", "-j")).get("devices", {})


          def runtime_label(runtime):
              return runtime.get("name") or runtime["identifier"]


          def ok(udid, name, runtime):
              print("\t".join(["OK", udid, name, runtime["identifier"], runtime_label(runtime)]))
              return 0


          def skipped(reason):
              print("SKIPPED\t" + reason)
              return 0


          def existing_device(devices, runtime, names):
              entries = [d for d in devices.get(runtime["identifier"], []) if d.get("isAvailable", True)]
              for name in names:
                  for entry in entries:
                      if entry.get("name") == name:
                          return entry
              return None


          def create_device(runtime, type_entry):
              name = "Pulse Tour " + type_entry["name"]
              try:
                  udid = simctl("create", name, type_entry["identifier"], runtime["identifier"]).strip()
              except subprocess.CalledProcessError as error:
                  log("simctl create failed for " + type_entry["name"] + " on " + runtime["identifier"] + ": " + str(error))
                  CREATE_ERRORS.append(type_entry["name"] + " on " + runtime_label(runtime))
                  return None
              if not udid:
                  return None
              log("created " + name + " on " + runtime["identifier"] + ": " + udid)
              return {"name": name, "udid": udid}


          def pick_named(runtimes, devices, wanted):
              # The newest runtime that has the device (an existing one, else the device type).
              for runtime in reversed(runtimes):
                  found = existing_device(devices, runtime, [wanted])
                  if found:
                      return ok(found["udid"], found["name"], runtime)
                  types = {t.get("name"): t for t in runtime.get("supportedDeviceTypes", [])}
                  if wanted in types:
                      made = create_device(runtime, types[wanted])
                      if made:
                          return ok(made["udid"], made["name"], runtime)
              seen = sorted({t.get("name", "") for r in runtimes for t in r.get("supportedDeviceTypes", []) if "iPhone" in t.get("name", "")})
              if CREATE_ERRORS:
                  return skipped("the device type '" + wanted + "' exists but 'simctl create' failed (" + "; ".join(CREATE_ERRORS) + ")")
              return skipped("the device type '" + wanted + "' is not available on any installed iOS runtime >= 17.0 (iPhone types seen: "
                             + ", ".join(seen) + ")")


          def pick_oldest(runtimes, devices):
              runtime = runtimes[0]
              log("oldest installed iOS runtime >= 17.0: " + runtime_label(runtime) + " (" + runtime["identifier"] + ")")
              if runtime_version(runtime["identifier"]) >= (18, 0):
                  log("NOTE: no iOS 17 runtime is installed on this runner; the oldest runtime is " + runtime_label(runtime))
              found = existing_device(devices, runtime, OLDEST_PREFERENCE)
              if not found:
                  iphones = sorted([d for d in devices.get(runtime["identifier"], [])
                                    if d.get("isAvailable", True) and d.get("name", "").startswith("iPhone")],
                                   key=lambda d: d.get("name", ""))
                  found = iphones[0] if iphones else None
              if found:
                  return ok(found["udid"], found["name"], runtime)
              types = {t.get("name"): t for t in runtime.get("supportedDeviceTypes", []) if t.get("name", "").startswith("iPhone")}
              for name in OLDEST_PREFERENCE + sorted(types):
                  if name in types:
                      made = create_device(runtime, types[name])
                      if made:
                          return ok(made["udid"], made["name"], runtime)
              return skipped("the oldest iOS runtime (" + runtime_label(runtime) + ") offers no iPhone device type that could be created")


          def main():
              wanted = sys.argv[1] if len(sys.argv) > 1 else ""
              runtimes = ios_runtimes()
              devices = available_devices()
              log("installed iOS runtimes >= 17.0, oldest first: " + ", ".join(runtime_label(r) for r in runtimes))
              for runtime in runtimes:
                  names = sorted(d.get("name", "") for d in devices.get(runtime["identifier"], []) if d.get("isAvailable", True))
                  log("  " + runtime_label(runtime) + ": " + ", ".join(names))
              if not runtimes:
                  return skipped("no iOS simulator runtime >= 17.0 is installed on this runner")
              if wanted.lower().startswith("oldest"):
                  return pick_oldest(runtimes, devices)
              return pick_named(runtimes, devices, wanted)


          try:
              sys.exit(main())
          except Exception:
              traceback.print_exc()
              sys.exit(2)
          PY

          cat > "$RUNNER_TEMP/summarize_result.py" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          label = sys.argv[2]
          try:
              with open(path) as handle:
                  data = json.load(handle)
          except Exception as error:
              print(label + ": no readable result summary (" + str(error) + ")")
              sys.exit(0)
          if not isinstance(data, dict):
              print(label + ": unexpected result summary of type " + type(data).__name__)
              sys.exit(0)


          def text(value):
              return "?" if value is None else str(value)


          print(label + ": result=" + text(data.get("result")) + " total=" + text(data.get("totalTestCount"))
                + " passed=" + text(data.get("passedTests")) + " failed=" + text(data.get("failedTests"))
                + " skipped=" + text(data.get("skippedTests")))
          for failure in data.get("testFailures") or []:
              if isinstance(failure, dict):
                  print("  FAILED " + text(failure.get("testName")) + " [" + text(failure.get("targetName")) + "]: "
                        + text(failure.get("failureText")))
          for insight in data.get("topInsights") or []:
              if isinstance(insight, dict):
                  print("  insight: " + text(insight.get("text")))
          PY

          cat > "$RUNNER_TEMP/fallback_attachments.py" <<'PY'
          import json
          import os
          import re
          import shutil
          import sys

          manifest_path = sys.argv[1]
          attachments_dir = sys.argv[2]
          out_dir = sys.argv[3]
          prefixes = sys.argv[4:]
          try:
              with open(manifest_path) as handle:
                  manifest = json.load(handle)
          except Exception as error:
              print("cannot read " + manifest_path + ": " + str(error))
              sys.exit(0)

          items = []


          def walk(node):
              if isinstance(node, dict):
                  if "exportedFileName" in node:
                      items.append(node)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)


          walk(manifest)
          copied = 0
          for item in items:
              exported = str(item.get("exportedFileName"))
              name = str(item.get("suggestedHumanReadableName") or exported)
              name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.[A-Za-z0-9]+$)", "", name)
              name = re.sub(r"(\.png)+$", ".png", os.path.basename(name), flags=re.IGNORECASE)
              if not name.lower().endswith(".png"):
                  continue
              if not any(name.startswith(prefix) for prefix in prefixes):
                  continue
              name = re.sub(r"[^A-Za-z0-9._-]", "_", name)
              source = os.path.join(attachments_dir, exported)
              target = os.path.join(out_dir, name)
              if os.path.isfile(source) and not os.path.exists(target):
                  shutil.copyfile(source, target)
                  copied += 1
          print("copied " + str(copied) + " PNG attachment(s) of " + str(len(items)) + " listed in the manifest")
          PY

      # The project needs Xcode 16 (the code also builds with 15.4). Use the newest installed 16.x release.
      - name: Select Xcode 16
        run: |
          echo "Default: $(xcodebuild -version | head -n 1)"
          newest="$(python3 - <<'PY'
          import glob, re

          def key(path):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$", path)
              return tuple(int(part) for part in match.group(1).split(".")) if match else ()

          apps = [p for p in glob.glob("/Applications/Xcode_16*.app") if re.search(r"Xcode_16(\.\d+)*\.app$", p)]
          print(max(apps, key=key) if apps else "")
          PY
          )"
          if [ -n "$newest" ]; then
            echo "Selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          else
            echo "::warning::No Xcode 16.x installed on this runner image, using the default Xcode"
          fi
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      # Picks (or creates) the simulator before anything expensive happens. A missing device type or runtime is not an error: the
      # entry prints SKIPPED, sets TOUR_SKIPPED for the later steps and still succeeds. A crash of the picker is an error.
      - name: Find the simulator
        id: pick
        timeout-minutes: 10
        run: |
          status=0
          result="$(python3 "$RUNNER_TEMP/pick_tour_sim.py" "$TOUR_DEVICE" 2> "$LOG_DIR/pick-sim.log")" || status=$?
          cat "$LOG_DIR/pick-sim.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::The simulator picker failed with exit code $status (see its output above)"
            exit 1
          fi
          kind="$(printf '%s\n' "$result" | head -n 1 | cut -f1)"
          case "$kind" in
            OK)
              udid="$(printf '%s\n' "$result" | head -n 1 | cut -f2)"
              name="$(printf '%s\n' "$result" | head -n 1 | cut -f3)"
              runtime="$(printf '%s\n' "$result" | head -n 1 | cut -f5)"
              echo "Using the simulator '$name' on $runtime ($udid) for the entry '$TOUR_NAME'"
              {
                echo "TOUR_UDID=$udid"
                echo "TOUR_SIM_NAME=$name"
                echo "TOUR_RUNTIME=$runtime"
              } >> "$GITHUB_ENV"
              ;;
            SKIPPED)
              reason="$(printf '%s\n' "$result" | head -n 1 | cut -f2-)"
              echo "SKIPPED: $reason"
              echo "::notice title=matrix $TOUR_NAME skipped::$reason"
              {
                echo "TOUR_SKIPPED=1"
                echo "TOUR_SKIP_REASON=$reason"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unexpected output of the simulator picker: $result"
              exit 1
              ;;
          esac

      - name: Install XcodeGen
        if: env.TOUR_SKIPPED != '1'
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        id: generate
        if: env.TOUR_SKIPPED != '1'
        working-directory: ios
        run: |
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodegen.log" xcodegen generate
          xcodebuild -list -project PulseStrength.xcodeproj | tee "$LOG_DIR/xcodebuild-list.log"

      # Prints what `simctl ui` accepts, so a wrong content-size spelling can be fixed from the log. Never fails.
      - name: Simulator UI options (diagnostics)
        if: env.TOUR_SKIPPED != '1'
        continue-on-error: true
        run: |
          echo "----- xcrun simctl help ui -----"
          xcrun simctl help ui 2>&1 || true
          echo "----- xcrun simctl ui (usage) -----"
          xcrun simctl ui 2>&1 | head -n 60 || true
          echo "----- xcrun simctl ui booted content_size (no device is booted yet, so an error is normal) -----"
          xcrun simctl ui booted content_size 2>&1 || true

      # Boots the device and sets what the entry is about. Every command is tolerated; simulator-settings.txt (in the artifact)
      # records which setting was applied and what the simulator reports afterwards, because a run at the wrong size or in the wrong
      # appearance would otherwise look like a valid result.
      - name: Boot the simulator and apply appearance, content size and status bar
        id: boot
        if: env.TOUR_SKIPPED != '1'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$SCREENS_DIR"
          settings="$SCREENS_DIR/simulator-settings.txt"
          {
            echo "simulator: $TOUR_SIM_NAME ($TOUR_UDID)"
            echo "runtime: $TOUR_RUNTIME"
            echo "requested: appearance=$TOUR_APPEARANCE content_size=$TOUR_CONTENT_SIZE"
          } > "$settings"
          # XCUIElement.typeText needs the software keyboard (the long flow types; the tour does not, the setting stays the same).
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO || true
          xcrun simctl boot "$TOUR_UDID" || echo "::warning::simctl boot failed (the device may be booted already); continuing"
          if ! xcrun simctl bootstatus "$TOUR_UDID" -b; then
            echo "::warning::simctl bootstatus failed; xcodebuild will try to boot the device itself"
          fi
          if xcrun simctl ui "$TOUR_UDID" appearance "$TOUR_APPEARANCE"; then
            echo "appearance: set to $TOUR_APPEARANCE" >> "$settings"
          else
            echo "::warning::could not set the appearance to $TOUR_APPEARANCE"
            echo "appearance: FAILED to set $TOUR_APPEARANCE" >> "$settings"
          fi
          echo "appearance now: $(xcrun simctl ui "$TOUR_UDID" appearance 2>&1 || true)" | tee -a "$settings"
          if xcrun simctl ui "$TOUR_UDID" content_size "$TOUR_CONTENT_SIZE"; then
            echo "content_size: set to $TOUR_CONTENT_SIZE" >> "$settings"
          else
            echo "::warning::could not set the content size to $TOUR_CONTENT_SIZE (the step 'Simulator UI options' lists the valid values)"
            echo "content_size: FAILED to set $TOUR_CONTENT_SIZE" >> "$settings"
          fi
          echo "content size now: $(xcrun simctl ui "$TOUR_UDID" content_size 2>&1 || true)" | tee -a "$settings"
          xcrun simctl status_bar "$TOUR_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 \
            || echo "::warning::could not override the simulator status bar"
          xcrun simctl list devices available | tee "$LOG_DIR/simctl-devices.log"

      - name: Screenshot tour (StrengthTourTests)
        id: tour
        if: env.TOUR_SKIPPED != '1'
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ios
        run: |
          if [ -z "${TOUR_UDID:-}" ]; then
            echo "::error::No simulator was picked (see the step 'Find the simulator')"
            exit 1
          fi
          "$RUNNER_TEMP/run_logged.sh" "$LOG_DIR/xcodebuild-tour.log" \
            xcodebuild test -project PulseStrength.xcodeproj -scheme PulseStrengthUITests \
            -configuration Debug \
            -destination "id=$TOUR_UDID" \
            -only-testing:PulseStrengthUITests/StrengthTourTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULTS_DIR/tour.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # xcresult summary (`xcresulttool get test-results`, Xcode 16; may fail without consequence), the fallback that exports the PNG
      # attachments of the bundle when the test wrote no PNG files itself, and the logs.
      - name: Collect results
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR/results" "$SCREENS_DIR/logs"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          bundle="$RESULTS_DIR/tour.xcresult"
          if [ -d "$bundle" ]; then
            summary="$SCREENS_DIR/results/tour-summary.json"
            failures="$SCREENS_DIR/results/tour-failures.txt"
            if xcrun xcresulttool get test-results summary --path "$bundle" > "$summary" 2> "$SCREENS_DIR/results/tour-summary.err"; then
              python3 "$RUNNER_TEMP/summarize_result.py" "$summary" tour > "$failures" || true
            else
              echo "tour: xcresulttool could not read the result bundle (see tour-summary.err)" > "$failures"
            fi
            cat "$failures"
            if [ "$(count 'tour-*.png')" -eq 0 ]; then
              echo "No tour-*.png was written to $SCREENS_DIR: trying to export the attachments of tour.xcresult"
              att="$RUNNER_TEMP/attachments-tour"
              rm -rf "$att"
              mkdir -p "$att"
              if xcrun xcresulttool export attachments --path "$bundle" --output-path "$att" > "$LOG_DIR/export-attachments-tour.log" 2>&1; then
                python3 "$RUNNER_TEMP/fallback_attachments.py" "$att/manifest.json" "$att" "$SCREENS_DIR" "tour-" || true
              else
                echo "xcresulttool export attachments failed (see logs/export-attachments-tour.log)"
              fi
            fi
          else
            echo "No result bundle: the tour did not run (or xcodebuild failed before it started)"
          fi
          cp "$LOG_DIR"/*.log "$SCREENS_DIR/logs/" 2>/dev/null || true

      # The digest goes into the artifact (digest.txt) and is printed again by the gate, at the very end of the log.
      - name: Write the digest
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          tidy() { LC_ALL=C sed -E 's#/Users/runner/work/[^/]+/[^/]+/##g' | LC_ALL=C cut -c1-300; }
          layout="$SCREENS_DIR/tour-$TOUR_NAME-layout.txt"
          flow="$SCREENS_DIR/tour-$TOUR_NAME-flow-log.txt"
          log="$LOG_DIR/xcodebuild-tour.log"
          {
            echo "strength-ios matrix digest: $TOUR_NAME"
            echo "requested: device='$TOUR_DEVICE' appearance=$TOUR_APPEARANCE content_size=$TOUR_CONTENT_SIZE"
            if [ -n "${TOUR_SKIPPED:-}" ]; then
              echo "SKIPPED: ${TOUR_SKIP_REASON:-no reason recorded}"
            else
              echo "simulator: ${TOUR_SIM_NAME:-unknown} on ${TOUR_RUNTIME:-unknown} (${TOUR_UDID:-no udid})"
            fi
            echo "PNGs: tour=$(count 'tour-*.png') total=$(count '*.png')"

            if [ -f "$SCREENS_DIR/simulator-settings.txt" ]; then
              echo ""
              echo "===== simulator settings (what was applied) ====="
              cat "$SCREENS_DIR/simulator-settings.txt"
            fi

            echo ""
            if [ ! -f "$log" ]; then
              echo "===== xcodebuild-tour: no log (the step did not run) ====="
            else
              echo "===== xcodebuild-tour: verdict ====="
              grep -E "\*\* (BUILD|TEST) (SUCCEEDED|FAILED) \*\*|Executed [0-9]+ tests?, with|Testing failed" "$log" | tail -n 5 || true
              echo "===== xcodebuild-tour: unique error: / XCTAssert / failed lines ====="
              grep -E "error:|XCTAssert|failed|FAILED" "$log" | tidy | sort -u | head -n 60 || true
            fi

            if [ -f "$SCREENS_DIR/results/tour-failures.txt" ]; then
              echo ""
              echo "===== xcresult summary ====="
              head -n 40 "$SCREENS_DIR/results/tour-failures.txt" | cut -c1-400
            fi

            if [ -f "$flow" ]; then
              echo ""
              echo "===== $(basename "$flow"): summary and FAILED / SKIPPED steps ====="
              grep "SUMMARY:" "$flow" | cut -c1-300 || true
              grep -A2 -E "\] (FAILED|SKIPPED)" "$flow" | cut -c1-300 | head -n 120 || true
            fi

            echo ""
            echo "===== LAYOUT VIOLATION lines ====="
            if [ -f "$layout" ]; then
              grep "LAYOUT VIOLATION" "$layout" | cut -c1-400 | head -n 60 || true
              echo "(count: $(grep -c 'LAYOUT VIOLATION' "$layout" || true))"
              echo ""
              echo "===== $(basename "$layout") ====="
              head -n 400 "$layout" | cut -c1-300
            else
              echo "(no layout file: the tour did not reach the active-workout screen, or did not run)"
            fi

            echo ""
            echo "===== tour: $(count 'tour-*.png') PNG file names ====="
            find "$SCREENS_DIR" -maxdepth 1 -type f -name 'tour-*.png' | sed 's#.*/##' | sort | paste -s -d ' ' - | fold -s -w 180 || true
            echo ""
            echo "===== other files in screens/ ====="
            find "$SCREENS_DIR" -maxdepth 1 -type f ! -name '*.png' | sed 's#.*/##' | sort | paste -s -d ' ' - | fold -s -w 180 || true
          } > "$SCREENS_DIR/digest.txt"
          echo "digest written to screens/digest.txt ($(wc -l < "$SCREENS_DIR/digest.txt" | tr -d ' ') lines); it is printed again by the Gate step"

      - name: Job summary
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          layout="$SCREENS_DIR/tour-$TOUR_NAME-layout.txt"
          violations="n/a"
          scrolls="n/a"
          if [ -f "$layout" ]; then
            violations="$(grep -c 'LAYOUT VIOLATION' "$layout" || true)"
            scrolls="$(grep -m1 '^pageScrolls:' "$layout" | cut -d' ' -f2 || true)"
          fi
          {
            echo "### strength-ios: matrix job, $TOUR_NAME"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| requested | $TOUR_DEVICE, $TOUR_APPEARANCE, content size $TOUR_CONTENT_SIZE |"
            if [ -n "${TOUR_SKIPPED:-}" ]; then
              echo "| result | SKIPPED: ${TOUR_SKIP_REASON:-no reason recorded} |"
            else
              echo "| simulator | ${TOUR_SIM_NAME:-unknown} on ${TOUR_RUNTIME:-unknown} |"
              echo "| xcodegen generate | ${{ steps.generate.outcome }} |"
              echo "| boot and settings | ${{ steps.boot.outcome }} |"
              echo "| tour (StrengthTourTests) | ${{ steps.tour.outcome }} |"
              echo "| screenshots | $(count 'tour-*.png') |"
              echo "| LAYOUT VIOLATION lines | $violations |"
              echo "| pageScrolls | $scrolls |"
            fi
            echo ""
            echo "Artifact **strength-matrix-$TOUR_NAME**: tour-$TOUR_NAME-NN-*.png, tour-$TOUR_NAME-layout.txt, digest.txt, logs/."
            echo "A failed assertion or a layout violation does not fail the job; only a run without any PNG does (a SKIPPED entry never fails)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-matrix-${{ matrix.name }}
          path: screens/
          if-no-files-found: warn
          retention-days: 14

      # Fails only when not a single PNG exists (unless the entry was SKIPPED). Failed assertions and layout violations do not
      # matter here: the job exists to produce screenshots and measurements.
      - name: Gate
        if: always()
        run: |
          mkdir -p "$SCREENS_DIR"
          count() { find "$SCREENS_DIR" -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          echo "================ strength-ios matrix ($TOUR_NAME): final digest ================"
          cat "$SCREENS_DIR/digest.txt" || echo "(no digest was written)"
          echo ""
          echo "================ strength-ios matrix ($TOUR_NAME): verdict ================"
          echo "step outcomes: pick=${{ steps.pick.outcome }} generate=${{ steps.generate.outcome }} boot=${{ steps.boot.outcome }} tour=${{ steps.tour.outcome }}"
          if [ -n "${TOUR_SKIPPED:-}" ]; then
            echo "SKIPPED: ${TOUR_SKIP_REASON:-no reason recorded}"
            echo "OK: the entry '$TOUR_NAME' was skipped, there is nothing to check"
            exit 0
          fi
          tour="$(count 'tour-*.png')"
          echo "PNGs: tour=$tour"
          layout="$SCREENS_DIR/tour-$TOUR_NAME-layout.txt"
          if [ -f "$layout" ]; then
            violations="$(grep -c 'LAYOUT VIOLATION' "$layout" || true)"
            if [ "$violations" != "0" ]; then
              echo "::warning title=Layout violations ($TOUR_NAME)::$violations LAYOUT VIOLATION line(s) in tour-$TOUR_NAME-layout.txt (see the digest above)"
            fi
          else
            echo "::warning title=No layout file ($TOUR_NAME)::The tour wrote no tour-$TOUR_NAME-layout.txt (see the digest above)"
          fi
          if [ "$tour" -eq 0 ]; then
            echo "::error::No tour screenshot was produced by the entry '$TOUR_NAME'"
            exit 1
          fi
          echo "OK: $tour screenshot(s) in the artifact strength-matrix-$TOUR_NAME"

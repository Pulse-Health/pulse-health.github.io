# Pulse Strength for Android (android/): builds and tests the pure Kotlin core and compiles the phone app and the Wear OS app.
#
#   build   :core unit tests, :app and :wear debug builds, lint, the JVM / Robolectric unit tests of the app modules.
#           Uploads the debug APKs and the lint / test reports as artifacts (14 days).
#
# Nothing here runs on a device or an emulator; see android/README.md, "Verification status".

name: strength-android

on:
  pull_request:
    paths:
      - 'android/**'
      - 'widgets/**'
      - '.github/workflows/strength-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'widgets/**'
      - '.github/workflows/strength-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strength-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --stacktrace

      - name: Build the phone and the watch app
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Unit tests of the app modules
        run: ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug :wear:lintDebug --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-android-reports
          path: |
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/tests/**
            android/**/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

# Pulse Strength (android/): verifies the Kotlin core and the Compose app, builds the release bundle and, on request, uploads it to Google Play.
#
#   verify         Unit tests of :core (JUnit) and :app (Robolectric: Compose UI, services), Android lint, a debug build. Uploads the test
#                  reports, the lint report and the rendered UI screenshots (artifact `android-screens`, 14 days). Runs on every pull
#                  request / push that touches android/.
#   version        Works out the versionName and versionCode of a release (tag `android-vX.Y.Z`, or `pulse.versionName` of
#                  android/gradle.properties / 1.0.0) and refuses a tag that is not on main. No secrets.
#   release-build  UNSIGNED release bundle (.aab) and APK with R8 shrinking, to prove that the release build works, plus the guard
#                  that fails when the release APK asks for a network permission: the privacy policy and the Play data-safety answers
#                  promise an offline app. Uploads the bundle, the APK and the R8 mapping file. No secrets: it runs on tags
#                  `android-v*` and on demand.
#   deploy         Builds the SIGNED bundle and uploads it to Google Play (track chosen at dispatch, default `internal`; tag pushes
#                  always upload a draft to `internal`). Runs on tags `android-v*` or when started by hand with "deploy". It is the
#                  only job that sees the signing key and the Play service account, because they are secrets of the `google-play`
#                  environment: required reviewers and the tag restriction of that environment are what gate a release. See
#                  android/RELEASING.md for the setup.
#
# Secrets of the `google-play` ENVIRONMENT (not repository secrets, so that only the deploy job can read them):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   the upload key (base64 of the .jks file)
#   PLAY_SERVICE_ACCOUNT_JSON                                                                    JSON key of the Play API service account
# Variable (optional): ANDROID_VERSION_CODE_OFFSET  added to the run number to make the Play versionCode (default 0).

name: strength-android

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/strength-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/strength-android.yml'
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Build the signed bundle and upload it to Google Play'
        type: boolean
        default: false
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (use draft until the app has been published once)'
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: strength-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper (checksum of android/gradle/wrapper/gradle-wrapper.jar)
        uses: gradle/actions/wrapper-validation@v4

      - name: Android SDK packages (platform 37 and build-tools 36 are what the build compiles against)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: android/app/build/screens
          retention-days: 14
          if-no-files-found: ignore

  version:
    name: version
    needs: verify
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        shell: bash
        env:
          VERSION_CODE_OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          code=$(( RUN_NUMBER + ${VERSION_CODE_OFFSET:-0} ))
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            name="${GITHUB_REF#refs/tags/android-v}"
          else
            name=$(grep -E '^pulse\.versionName=' android/gradle.properties | cut -d= -f2 || true)
            name="${name:-1.0.0}"
          fi
          # The name ends up in a command line and in the store: only a plain version number is accepted.
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$name' is not a version number like 1.0.0 (a tag must be android-v1.0.0)."
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionName $name, versionCode $code"

      - name: A release tag must be on main
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag does not point at a commit of main: a release is built from main only."
            exit 1
          fi

  release-build:
    name: release-build
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper (checksum of android/gradle/wrapper/gradle-wrapper.jar)
        uses: gradle/actions/wrapper-validation@v4

      - name: Android SDK packages (platform 37 and build-tools 36 are what the build compiles against)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the unsigned release bundle and APK (R8)
        env:
          PULSE_VERSION_CODE: ${{ needs.version.outputs.code }}
          PULSE_VERSION_NAME: ${{ needs.version.outputs.name }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease "-Ppulse.versionName=$PULSE_VERSION_NAME"

      - name: The release APK asks for no network permission
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -s "$apk" || { echo "::error::No release APK was built."; exit 1; }
          permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk")
          echo "$permissions"
          if grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' <<< "$permissions"; then
            echo "::error::The release APK requests a network permission, but the privacy policy and Play data-safety answers say the app is offline."
            exit 1
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' <<< "$permissions" || { echo "::error::aapt2 printed no permissions: the check proves nothing."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

  deploy:
    name: deploy
    needs: [version, release-build]
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper (checksum of android/gradle/wrapper/gradle-wrapper.jar)
        uses: gradle/actions/wrapper-validation@v4

      - name: Android SDK packages (platform 37 and build-tools 36 are what the build compiles against)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. The signing secrets belong to the 'google-play' environment (android/RELEASING.md, section 4)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "PULSE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed release bundle and APK (R8)
        env:
          PULSE_VERSION_CODE: ${{ needs.version.outputs.code }}
          PULSE_VERSION_NAME: ${{ needs.version.outputs.name }}
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease "-Ppulse.versionName=$PULSE_VERSION_NAME" -Ppulse.requireSigning=true

      - name: The signed bundle verifies and the release APK asks for no network permission
        run: |
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle" || { echo "::error::No release bundle was built."; exit 1; }
          verification=$(jarsigner -verify "$bundle")
          echo "$verification"
          grep -q 'jar verified' <<< "$verification" || { echo "::error::The bundle is not signed."; exit 1; }
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk")
          echo "$permissions"
          if grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' <<< "$permissions"; then
            echo "::error::The release APK requests a network permission."
            exit 1
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' <<< "$permissions" || { echo "::error::aapt2 printed no permissions: the check proves nothing."; exit 1; }

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: health.pulse.strength
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'draft' }}
          whatsNewDirectory: android/store/whatsnew

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
